package:
  name: "pycomet"
  version: "0.0.1"

source:
  git_url: https://github.com/ivanZanardi/pycomet

build:
  # noarch: python
  # script: {{ PYTHON }} setup.py bdist_wheel && pip install dist/*.whl
  script: python setup.py build && python setup.py install
  # script: python -m pip install . --no-deps --ignore-installed -vv
  number: 0
  entry_points:
    - pycomet = pycomet.__main__:main

requirements:
  host:
    - python
    - h5py
    - argparse
    - joblib
    - matplotlib
    - netron
    - numpy
    - pandas
    - pyDOE
    - scikit_learn
    - scipy
    - seaborn
    - setuptools
    - tensorflow>=2.4.1
    - tensorflow-gpu>=2.4.1
    - tensorflow-addons>=0.12.1
    - threadpoolctl
    - tqdm
  run:
    - python
    - h5py
    - argparse
    - joblib
    - matplotlib
    - netron
    - numpy
    - pandas
    - pyDOE
    - scikit_learn
    - scipy
    - seaborn
    - setuptools
    - tensorflow>=2.4.1
    - tensorflow-gpu>=2.4.1
    - tensorflow-addons>=0.12.1
    - threadpoolctl
    - tqdm

test:
  imports:
    - pycomet
  commands:
    - pycomet --help

about:
  home: https://github.com/ivanZanardi/pycomet
  license: Apache Software License 2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: 'Physics-informed machine learning for scientific computations and operator discovery.'

extra:
  recipe-maintainers:
  - ivanZanardi